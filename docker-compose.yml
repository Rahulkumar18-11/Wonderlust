services:
  web:
    build: .
    container_name: wanderlust_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ATLASDB_URL=mongodb://mongo:27017/wanderlust
      - SECRET=${SECRET:-z_2hb8CQoQvjWR6-1hETtEcz2Tw}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN:-pk.eyJ1IjoidGVzdCJ9.mocktokenforlocaldev}
      - MAP_TOKEN=${MAP_TOKEN:-pk.eyJ1IjoidGVzdCJ9.mocktokenforlocaldev}
      - CLOUD_NAME=${CLOUD_NAME:-WanderLust}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-899747826383949}
      - CLOUD_API_SECRET=${CLOUD_API_SECRET:-z_2hb8CQoQvjWR6-1hETtEcz2Tw}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: wanderlust_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:

